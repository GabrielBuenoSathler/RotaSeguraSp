services:
  db:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Defina POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: rotasegura_test
    ports:
      - '127.0.0.1:${DATABASE_PORT:-5444}:5432'
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./test-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro
      - ./test-occurrences.sql:/docker-entrypoint-initdb.d/02-occurrences.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
volumes:
  postgres-test-data:
