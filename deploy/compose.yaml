services:
  db:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - '127.0.0.1:${DATABASE_PORT:?Defina DATABASE_PORT}:5432'
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Defina POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
      POSTGRES_APP_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DATABASE:?Defina POSTGRES_DATABASE}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/10-postgis.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    # Only the private frontend proxy can reach this API; it overwrites X-Forwarded-For.
    command: [uvicorn, app.main:app, --host, 0.0.0.0, --port, '8000', --proxy-headers, '--forwarded-allow-ips=*']
    environment: &runtime-environment
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?Defina POSTGRES_DATABASE}
      APP_ENV: ${APP_ENV:?Defina APP_ENV}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      SQL_ECHO: "${SQL_ECHO:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-[]}"
      VALHALLA_URL: "${VALHALLA_URL:-http://host.docker.internal:8002}"
      VALHALLA_TIMEOUT_SECONDS: "${VALHALLA_TIMEOUT_SECONDS:-30}"
      ROUTE_ALTERNATES: "${ROUTE_ALTERNATES:-2}"
      RISK_RADIUS_METERS: "${RISK_RADIUS_METERS:-50}"
      RISK_WINDOW_DAYS: "${RISK_WINDOW_DAYS:-365}"
      DATASET_SOURCE: "${DATASET_SOURCE:-Base de ocorrências importada pelo administrador}"
      GEOCODER_USER_AGENT: "${GEOCODER_USER_AGENT:-RotaSeguraSP/0.1}"
      DATABASE_STATEMENT_TIMEOUT_MS: "${DATABASE_STATEMENT_TIMEOUT_MS:-15000}"
      NOMINATIM_URL: ${NOMINATIM_URL:-}
      OCCURRENCE_GROUP_DATE_COLUMN: ${OCCURRENCE_GROUP_DATE_COLUMN:-}
      OCCURRENCE_DATE_COLUMN: ${OCCURRENCE_DATE_COLUMN:-}
      DATASET_UPDATED_AT: ${DATASET_UPDATED_AT:-}

    extra_hosts:
      - host.docker.internal:host-gateway
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  migrate:
    profiles: [maintenance]
    build:
      context: ..
      dockerfile: Dockerfile.backend
    environment:
      <<: *runtime-environment
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?Defina POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Defina POSTGRES_ADMIN_PASSWORD}
    command: [alembic, upgrade, head]
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    ports:
      - '${BIND_HOST:-127.0.0.1}:${FRONTEND_PORT:?Defina FRONTEND_PORT}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
