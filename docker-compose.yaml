services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rotasegura-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres_ocorrencias
      POSTGRES_PORT: 5432
      APP_ENV: production

    ports:
      - "8000:8000"

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - rotasegura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}

    container_name: rotasegura-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      backend:
        condition: service_healthy

    networks:
      - rotasegura-network

networks:
  rotasegura-network:
    name: crimes_sp_default
    external: true
