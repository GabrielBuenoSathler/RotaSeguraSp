services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: rotasegura-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      POSTGRES_HOST: postgres_ocorrencias
      POSTGRES_PORT: 5432
      APP_ENV: production

    ports:
      - "8000:8000"

    networks:
      - rotasegura-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:8000

    container_name: rotasegura-frontend
    restart: unless-stopped

    ports:
      - "3000:80"

    depends_on:
      - backend

    networks:
      - rotasegura-network

networks:
  rotasegura-network:
    name: crimes_sp_default
    external: true
