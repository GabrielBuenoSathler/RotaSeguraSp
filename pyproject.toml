[project]
name = "crimes-sp"
version = "0.1.0"
description = ""
authors = [
    {name = "GabrielBuenoSathler",email = "garouthehumanmonster@protonmail.com"}
]
requires-python = ">=3.13"
dependencies = [
    "fastapi (>=0.142.2,<0.143.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "sqlalchemy (>=2.1.3,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "geoalchemy2 (>=0.20.0,<0.21.0)",
    "pydantic-settings (>=2.15.0,<3.0.0)",
    "greenlet (>=3.5.6,<4.0.0)",
    "load-dotenv (>=0.1.0,<0.2.0)",
    "alembic (>=1.20.0,<2.0.0)",
    "psycopg (>=3.3.6,<4.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.16.10,<0.17.0)"
]
